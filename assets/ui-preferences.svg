<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="100%" height="100%">
  <defs>
    <filter id="shadow-modal" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#1c1917" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1c1917" flood-opacity="0.08" />
    </filter>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .font-serif { font-family: Georgia, Cambria, "Times New Roman", Times, serif; }
      .meta { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
    </style>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="100%" height="100%" fill="#f2f0ea" rx="16" />

  <!-- Preferences Modal Window Container -->
  <g transform="translate(190, 45)" filter="url(#shadow-modal)">
    <rect width="500" height="470" rx="12" fill="#faf9f5" stroke="#d6d3d1" stroke-width="1" />

    <!-- Modal Header -->
    <g transform="translate(24, 20)">
      <text x="0" y="16" class="meta" font-size="11" fill="#1c1917">Preferences</text>
      <text x="0" y="32" class="font-serif" font-style="italic" font-size="11" fill="#78716c">Model routing and security</text>
      
      <!-- Close icon -->
      <line x1="440" y1="12" x2="450" y2="22" stroke="#a8a29e" stroke-width="1.5" stroke-linecap="round" />
      <line x1="450" y1="12" x2="440" y2="22" stroke="#a8a29e" stroke-width="1.5" stroke-linecap="round" />

      <line x1="0" y1="44" x2="452" y2="44" stroke="#e7e5e4" stroke-width="1" />
    </g>

    <!-- Modal Form Body -->
    <g transform="translate(24, 82)">
      <!-- 1. API Key Field -->
      <g>
        <text x="0" y="12" class="font-sans" font-size="11" font-weight="600" fill="#44403c">GOOGLE GEMINI API KEY</text>
        <text x="375" y="12" class="font-mono" font-size="10" text-decoration="underline" fill="#78716c">Generate key ↗</text>

        <rect y="22" width="452" height="34" rx="6" fill="#ffffff" stroke="#d6d3d1" stroke-width="1" />
        <text x="14" y="43" class="font-mono" font-size="11" fill="#1c1917">AIzaSyB******************************</text>

        <text x="0" y="70" class="font-sans" font-size="10" fill="#a8a29e">Keys remain sandboxed locally on this machine.</text>
      </g>

      <!-- 2. Test & Discover Models Action -->
      <g transform="translate(0, 88)">
        <rect width="452" height="32" rx="6" fill="#f5f5f4" stroke="#d6d3d1" stroke-width="1" />
        <text x="120" y="20" class="font-sans" font-size="11" font-weight="500" fill="#292524">Test Connection &amp; Query Available Models</text>

        <!-- Feedback Pill -->
        <rect y="40" width="452" height="28" rx="6" fill="#f5f5f4" stroke="#d6d3d1" stroke-width="1" />
        <circle cx="16" cy="54" r="5" fill="#1c1917" />
        <path d="M14 54 l1.5 1.5 l3 -3" fill="none" stroke="#fafaf9" stroke-width="1.2" />
        <text x="28" y="58" class="font-sans" font-size="10.5" fill="#292524">Connected. Found 12 compatible generation models for your key.</text>
      </g>

      <!-- 3. Active Generation Model Dropdown -->
      <g transform="translate(0, 172)">
        <text x="0" y="12" class="font-sans" font-size="11" font-weight="600" fill="#44403c">ACTIVE GENERATION MODEL</text>
        <text x="390" y="12" class="font-mono" font-size="10" fill="#a8a29e">12 options</text>

        <rect y="22" width="452" height="34" rx="6" fill="#ffffff" stroke="#d6d3d1" stroke-width="1" />
        <text x="14" y="43" class="font-mono" font-size="11" font-weight="500" fill="#1c1917">Gemini 2.5 Flash (gemini-2.5-flash)</text>
        <path d="M430 36 l4 4 l4 -4" fill="none" stroke="#78716c" stroke-width="1.5" stroke-linecap="round" />

        <text x="0" y="70" class="font-sans" font-size="10.5" fill="#78716c">Fast, intelligent, and recommended for real-time developer writing.</text>
      </g>

      <!-- 4. Global Summon Notification -->
      <g transform="translate(0, 260)">
        <line x1="0" y1="0" x2="452" y2="0" stroke="#e7e5e4" stroke-width="1" />
        <text x="0" y="20" class="font-sans" font-size="11" fill="#78716c">Global summon</text>
        
        <rect x="376" y="8" width="76" height="18" rx="4" fill="#f5f5f4" stroke="#e7e5e4" stroke-width="1" />
        <text x="388" y="21" class="font-mono" font-size="10" fill="#44403c">ALT SHIFT E</text>
      </g>

      <!-- 5. Footer Buttons -->
      <g transform="translate(0, 310)">
        <line x1="0" y1="0" x2="452" y2="0" stroke="#e7e5e4" stroke-width="1" />
        <text x="270" y="24" class="font-sans" font-size="11" fill="#78716c">Cancel</text>

        <rect x="330" y="8" width="122" height="26" rx="6" fill="#1c1917" />
        <text x="348" y="25" class="font-sans" font-size="11" font-weight="500" fill="#fafaf9">Apply Preferences</text>
      </g>
    </g>
  </g>
</svg>
