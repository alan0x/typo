name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            target: ''
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Typo v__VERSION__'
          releaseBody: |
            ### Typo v__VERSION__ Release

            Typo is a lightweight, distraction-free desktop HUD that transforms rough English drafts into crisp, professional prose and turns plain text instructions into structured AI agent prompts.

            #### Downloads
            - **macOS (Recommended 1-Click Installer)**: `Typo_*_aarch64.pkg` (Apple Silicon) / `Typo_*_x64.pkg` (Intel)
            - **macOS (Disk Image)**: `Typo_*_aarch64.dmg` / `Typo_*_x64.dmg`
            - **Windows (Installer)**: `Typo_*_x64-setup.exe` / `Typo_*_x64_en-US.msi`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build and Upload macOS .pkg Installer
        if: matrix.platform == 'macos-latest'
        run: |
          # 1. Locate the built Typo.app
          APP_PATH=""
          if [ -d "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Typo.app" ]; then
            APP_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Typo.app"
          elif [ -d "src-tauri/target/release/bundle/macos/Typo.app" ]; then
            APP_PATH="src-tauri/target/release/bundle/macos/Typo.app"
          else
            APP_PATH=$(find src-tauri/target -name "Typo.app" -type d | head -n 1)
          fi

          echo "Target Typo.app found at: $APP_PATH"

          # 2. Verify the app bundle signature (tauri.conf.json sets ad-hoc
          #    signingIdentity "-", so the bundle must already be signed here)
          codesign --verify --deep --strict "$APP_PATH"

          # 3. Create postinstall script to strip quarantine upon installation
          mkdir -p .pkg-scripts
          cat << 'EOF' > .pkg-scripts/postinstall
          #!/bin/bash
          APP_DEST="/Applications/Typo.app"
          if [ -d "$APP_DEST" ]; then
            xattr -cr "$APP_DEST" 2>/dev/null || true
            chmod -R 755 "$APP_DEST" 2>/dev/null || true
          fi
          exit 0
          EOF
          chmod +x .pkg-scripts/postinstall

          # 4. Build .pkg installer (version read from tauri.conf.json)
          APP_VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          ARCH_NAME="${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x64' }}"
          PKG_NAME="Typo_${APP_VERSION}_${ARCH_NAME}.pkg"

          pkgbuild --component "$APP_PATH" \
                   --install-location "/Applications" \
                   --scripts .pkg-scripts \
                   --identifier "com.typo.desktop" \
                   --version "$APP_VERSION" \
                   "$PKG_NAME"

          echo "Built $PKG_NAME successfully!"

          # 5. Upload .pkg to GitHub Release
          gh release upload "${{ github.ref_name }}" "$PKG_NAME" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
